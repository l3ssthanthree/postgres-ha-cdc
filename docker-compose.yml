services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: fruits_etcd1
    hostname: etcd1
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=fruits-etcd-cluster
      - --enable-v2=false
    volumes:
      - etcd1_data:/etcd-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  etcd2:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: fruits_etcd2
    hostname: etcd2
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=fruits-etcd-cluster
      - --enable-v2=false
    volumes:
      - etcd2_data:/etcd-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  etcd3:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: fruits_etcd3
    hostname: etcd3
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=fruits-etcd-cluster
      - --enable-v2=false
    volumes:
      - etcd3_data:/etcd-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  patroni1:
    image: fruits_patroni:latest
    build:
      context: .
      dockerfile: patroni/Dockerfile
    container_name: fruits_patroni1
    hostname: patroni1
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/patroni/data
      PATRONI_NAME: patroni1
      PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni1:5432
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
    ports:
      - "8008:8008"
    volumes:
      - pg_data_patroni1:/var/lib/postgresql/patroni
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  patroni2:
    image: fruits_patroni:latest
    container_name: fruits_patroni2
    hostname: patroni2
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/patroni/data
      PATRONI_NAME: patroni2
      PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni2:5432
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
    ports:
      - "8009:8008"
    volumes:
      - pg_data_patroni2:/var/lib/postgresql/patroni
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  patroni3:
    image: fruits_patroni:latest
    container_name: fruits_patroni3
    hostname: patroni3
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/patroni/data
      PATRONI_NAME: patroni3
      PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni3:5432
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
    ports:
      - "8010:8008"
    volumes:
      - pg_data_patroni3:/var/lib/postgresql/patroni
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  db:
    image: fruits_haproxy:latest
    build:
      context: .
      dockerfile: haproxy/Dockerfile
    container_name: fruits_haproxy
    hostname: db
    depends_on:
      patroni1:
        condition: service_started
      patroni2:
        condition: service_started
      patroni3:
        condition: service_started
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
      - "7000:7000"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fruits_migrator
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      MIGRATION_VERSION: ${MIGRATION_VERSION:-}
      RUN_SEQWALL: ${RUN_SEQWALL:-false}
      SEED_COUNT: ${SEED_COUNT:-10}
    volumes:
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
    restart: "no"

  workload:
    image: fruits_workload:latest
    build:
      context: .
      dockerfile: workload/Dockerfile
    container_name: fruits_workload
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      WORKLOAD_PORT: 8080
      WORKLOAD_DB_DSN: ${GOOSE_DBSTRING_DOCKER}
    ports:
      - "${WORKLOAD_PORT}:8080"
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: fruits_postgres_exporter
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: "db:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: "${METRICS_DB_USER}"
      DATA_SOURCE_PASS: "${METRICS_DB_PASSWORD}"
    ports:
      - "9187:9187"
    restart:
      unless-stopped

  minio:
    image: minio/minio:latest
    container_name: fruits_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio_init:
    image: fruits_backup_tools:latest
    container_name: fruits_minio_init
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_BACKUP_NAME: ${BUCKET_BACKUP_NAME}
      MINIO_BACKUP_ACCESS_KEY: ${MINIO_BACKUP_ACCESS_KEY}
      MINIO_BACKUP_SECRET_KEY: ${MINIO_BACKUP_SECRET_KEY}
      MINIO_RESTORE_ACCESS_KEY: ${MINIO_RESTORE_ACCESS_KEY}
      MINIO_RESTORE_SECRET_KEY: ${MINIO_RESTORE_SECRET_KEY}
    entrypoint: ["/opt/minio/init-minio.sh"]
    restart: "no"

  backup:
    image: fruits_backup_tools:latest
    build:
      context: .
      dockerfile: backup/Dockerfile
    container_name: fruits_backup
    depends_on:
      db:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BACKUP_ACCESS_KEY: ${MINIO_BACKUP_ACCESS_KEY}
      MINIO_BACKUP_SECRET_KEY: ${MINIO_BACKUP_SECRET_KEY}
      BUCKET_BACKUP_NAME: ${BUCKET_BACKUP_NAME}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT}
      BACKUP_STATE_FILE: /var/lib/backup/state/state.json
    volumes:
      - backup_state:/var/lib/backup/state
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - postgres_exporter
      - backup
      - minio
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fruits_grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards_stage4:ro
      - ./grafana/dashboards:/etc/grafana/dashboards_stage6:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  pg_data_patroni1:
  pg_data_patroni2:
  pg_data_patroni3:
  minio_data:
  backup_state:
  prometheus_data:
  grafana_data:
