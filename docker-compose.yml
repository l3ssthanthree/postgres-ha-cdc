services:
  db:
    image: postgres:18-alpine
    container_name: fruits_postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
      - ./scripts/init-metrics-user.sh:/docker-entrypoint-initdb.d/init-metrics-user.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fruits_migrator
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
    restart: "no"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: fruits_postgres_exporter
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: "db:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: "${METRICS_DB_USER}"
      DATA_SOURCE_PASS: "${METRICS_DB_PASSWORD}"
    ports:
      - "9187:9187"
    restart:
      unless-stopped

  minio:
    image: minio/minio:latest
    container_name: fruits_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio_init:
    image: fruits_backup_tools:latest
    container_name: fruits_minio_init
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_BACKUP_NAME: ${BUCKET_BACKUP_NAME}
      MINIO_BACKUP_ACCESS_KEY: ${MINIO_BACKUP_ACCESS_KEY}
      MINIO_BACKUP_SECRET_KEY: ${MINIO_BACKUP_SECRET_KEY}
      MINIO_RESTORE_ACCESS_KEY: ${MINIO_RESTORE_ACCESS_KEY}
      MINIO_RESTORE_SECRET_KEY: ${MINIO_RESTORE_SECRET_KEY}
    entrypoint: ["/opt/minio/init-minio.sh"]
    restart: "no"

  backup:
    image: fruits_backup_tools:latest
    build:
      context: .
      dockerfile: backup/Dockerfile
    container_name: fruits_backup
    depends_on:
      db:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BACKUP_ACCESS_KEY: ${MINIO_BACKUP_ACCESS_KEY}
      MINIO_BACKUP_SECRET_KEY: ${MINIO_BACKUP_SECRET_KEY}
      BUCKET_BACKUP_NAME: ${BUCKET_BACKUP_NAME}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT}
      BACKUP_STATE_FILE: /var/lib/backup/state/state.json
    volumes:
      - backup_state:/var/lib/backup/state
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    depends_on:
      - postgres_exporter
      - backup
      - minio
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: fruits_grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
  backup_state:
  prometheus_data:
  grafana_data:
