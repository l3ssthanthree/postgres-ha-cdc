services:
  db:
    image: postgres:18-alpine
    container_name: fruits_postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fruits_migrator
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts

volumes:
  pg_data: