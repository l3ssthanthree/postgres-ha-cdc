apiVersion: 1

providers:
  - name: "Stage 4 dashboards"
    orgId: 1
    folder: "PostgreSQL"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards_stage4

  - name: "Optimization dashboards"
    orgId: 1
    folder: "Optimization"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards_stage6
