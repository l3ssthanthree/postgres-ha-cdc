global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "patroni"
    static_configs:
      - targets:
          - "patroni1:8008"
          - "patroni2:8008"
          - "patroni3:8008"

  - job_name: "etcd"
    static_configs:
      - targets:
          - "etcd1:2379"
          - "etcd2:2379"
          - "etcd3:2379"

  - job_name: "haproxy"
    metrics_path: /metrics
    static_configs:
      - targets: ["db:7000"]

  - job_name: "backup_exporter"
    static_configs:
      - targets: ["backup:9091"]

  - job_name: "minio"
    metrics_path: /minio/metrics/v3
    static_configs:
      - targets: ["minio:9000"]
