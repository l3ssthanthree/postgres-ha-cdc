global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "backup_exporter"
    static_configs:
      - targets: ["backup:9091"]

  - job_name: "minio"
    metrics_path: /minio/metrics/v3
    static_configs:
      - targets: ["minio:9000"]
